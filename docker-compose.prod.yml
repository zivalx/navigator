name: navigator

services:
  postgres:
    container_name: navigator-postgres
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - navigator-net
    mem_limit: 512m

  redis:
    container_name: navigator-redis
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - navigator-net
    mem_limit: 256m

  api:
    container_name: navigator-api
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      APP_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - navigator-net
    stop_grace_period: 30s
    mem_limit: 512m

  frontend:
    container_name: navigator-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: "no"
    volumes:
      - frontend_build:/usr/share/nginx/html

  nginx:
    container_name: navigator-nginx
    image: nginx:1.25-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_completed_successfully
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
      - frontend_build:/usr/share/nginx/html:ro
    # No published ports: TLS and basic auth live at the edge Caddy (zivalx-ops),
    # which reaches this container as navigator-nginx:80 over the external edge network.
    networks:
      - navigator-net
      - edge
    mem_limit: 128m

networks:
  navigator-net:
    driver: bridge
  edge:
    external: true
    name: edge

volumes:
  pg_data:
  redis_data:
  frontend_build:
