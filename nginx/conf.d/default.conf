# Navigator nginx behind the shared edge Caddy (zivalx-ops). The edge owns TLS,
# HSTS and basic auth; this server listens on plain HTTP inside the edge network
# and is reached as navigator-nginx:80. No ports are published on the host.

# Re-resolve api through Docker's embedded DNS so a recreated container does not
# leave nginx with a stale IP (variable proxy_pass below).
resolver 127.0.0.11 valid=10s;

server {
    listen 80;
    server_name _;

    # Real client IP (for limit_req) from the edge's X-Forwarded-For.
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    set $api_upstream http://api:7000;

    # Security headers (HSTS is set by the edge)
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # API proxy
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 90s;
    }

    # Health endpoints (no rate limit; /health/deep is reached by the edge watchdog)
    location = /health {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
    }

    location = /health/deep {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
    }

    # Frontend static files
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;

        # Cache static assets aggressively
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
}
